# Global Hall of Fame for Shoot, Don't Talk (same worker code as River Raid's board, plus ?game=).
# KV id is filled in after `wrangler kv namespace create SCORES` on the owner's Mac.
name = "arcade-scores"
main = "worker.js"
compatibility_date = "2026-07-01"
workers_dev = true

[[kv_namespaces]]
binding = "SCORES"
id = "REPLACE_WITH_KV_ID"
